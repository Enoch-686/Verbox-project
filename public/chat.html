<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat - Verbox</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="./verbox-logo.svg">
    <style>
        :root {
            --bg-primary: #0D0B1E;
            --bg-secondary: rgba(26, 23, 68, 0.7);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.1);
            --hover-bg: rgba(255, 255, 255, 0.05);
            --active-bg: rgba(255, 107, 91, 0.1);
            --message-bg: rgba(255, 255, 255, 0.08);
            --brand-gradient: linear-gradient(135deg, #FF6B5B, #e85d4e);
            --sidebar-bg: rgba(26, 23, 68, 0.7);
            --unread-bg: #FF6B5B;
        }
        .light-mode {
            --bg-primary: #f0f2f5;
            --bg-secondary: rgba(255, 255, 255, 0.9);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(0, 0, 0, 0.6);
            --border-color: rgba(0, 0, 0, 0.08);
            --input-bg: rgba(0, 0, 0, 0.05);
            --input-border: rgba(0, 0, 0, 0.1);
            --hover-bg: rgba(0, 0, 0, 0.05);
            --active-bg: rgba(255, 107, 91, 0.15);
            --message-bg: rgba(0, 0, 0, 0.05);
            --brand-gradient: linear-gradient(135deg, #FF6B5B, #e85d4e);
            --sidebar-bg: rgba(255, 255, 255, 0.9);
            --unread-bg: #FF6B5B;
        }
        html, body { min-height: 100%; height: 100%; }
        html { min-height: 100dvh; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh; min-height: 100dvh;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }
        .bg-animated {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: radial-gradient(ellipse 600px 600px at 15% 50%, rgba(255,107,91,0.12) 0%, transparent 70%),
                        radial-gradient(ellipse 600px 600px at 85% 50%, rgba(127,182,133,0.12) 0%, transparent 70%),
                        radial-gradient(ellipse 800px 200px at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 70%),
                        linear-gradient(170deg, #0D0B1E 0%, #151238 30%, #1A1744 60%, #12102D 100%);
        }
        .light-mode .bg-animated {
            background: radial-gradient(ellipse 600px 600px at 15% 50%, rgba(255,107,91,0.05) 0%, transparent 70%),
                        radial-gradient(ellipse 600px 600px at 85% 50%, rgba(127,182,133,0.05) 0%, transparent 70%),
                        radial-gradient(ellipse 800px 200px at 50% 50%, rgba(0,0,0,0.02) 0%, transparent 70%),
                        linear-gradient(170deg, #f0f2f5 0%, #e4e7eb 30%, #f0f2f5 60%, #e4e7eb 100%);
        }
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.03; pointer-events: none;
            background-image: linear-gradient(var(--text-secondary) 1px, transparent 1px), linear-gradient(90deg, var(--text-secondary) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        
        .app-container { position: relative; z-index: 2; display: flex; flex-direction: column; min-height: 100dvh; height: auto; overflow: hidden; }

        /* Mobile Header */
        .mobile-header {
            display: flex; width: 100%; padding: 0.8rem 1rem;
            background: var(--sidebar-bg); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            align-items: center; justify-content: space-between;
            flex-shrink: 0; position: sticky; top: 0; z-index: 1030;
        }
        .mobile-header .brand-logo-icon {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; background: none; box-shadow: none;
        }
        .mobile-header .brand-logo-icon img { width: 100%; height: 100%; object-fit: contain; }
        .mobile-header .brand-name { font-weight: 700; font-size: 1.2rem; color: var(--text-primary); margin-left: 0.5rem; }
        .mobile-header .hamburger-btn { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; }

        /* Desktop Sidebar */
        .sidebar {
            display: none; flex-direction: column; width: 280px;
            background: var(--sidebar-bg); backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 1rem; flex-shrink: 0;
            transition: background 0.3s, border-color 0.3s;
        }

        .offcanvas { background: var(--sidebar-bg); backdrop-filter: blur(20px); border-right: 1px solid var(--border-color); }
        .offcanvas-body { padding: 1rem; display: flex; flex-direction: column; }

        /* Brand logo */
        .brand-logo-icon {
            width: 40px; height: 40px; background: none; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: none; overflow: hidden;
        }
        .brand-logo-icon img { width: 100%; height: 100%; object-fit: contain; }
        .brand { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; }
        .brand-name { font-weight: 700; font-size: 1.3rem; letter-spacing: -0.3px; color: var(--text-primary); }
        
        /* Transparent buttons */
        .sidebar-actions { margin-left: auto; display: flex; gap: 0.5rem; align-items: center; }
        .sidebar-actions button#themeToggleBtn,
        .sidebar-actions a[href*="profile"],
        .mobile-header button#themeToggleBtnMobile,
        .mobile-header a[href*="profile"] {
            background: transparent !important;
            background-color: transparent !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            color: var(--text-secondary);
            padding: 4px;
            border-radius: 6px;
            transition: color 0.2s;
        }
        .sidebar-actions button#themeToggleBtn:hover,
        .sidebar-actions a[href*="profile"]:hover,
        .mobile-header button#themeToggleBtnMobile:hover,
        .mobile-header a[href*="profile"]:hover {
            color: #FF6B5B;
            background: var(--hover-bg);
        }
        .sidebar-actions a#sidebarLogout { color: var(--text-secondary); transition: color 0.2s; }
        .sidebar-actions a#sidebarLogout:hover { color: #FF6B5B; }

        /* Clickable user profile */
        .user-profile {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0 0 1.25rem 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.25rem;
            cursor: pointer;
            transition: opacity 0.2s;
            text-decoration: none;
        }
        .user-profile:hover { opacity: 0.8; }
        .user-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--brand-gradient);
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 0.9rem; color: #fff; position: relative;
        }
        .status-dot { width: 8px; height: 8px; background: #22c55e; border: 2px solid var(--bg-secondary); border-radius: 50%; position: absolute; bottom: 0; right: 0; }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
        .user-status { font-size: 0.7rem; color: #22c55e; }
        .rooms-header { margin-bottom: 0.75rem; }
        .rooms-header span { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); opacity: 0.7; }
        .room-list { list-style: none; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; }
        .room-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
        .room-item:hover { background: var(--hover-bg); }
        .room-item.active { background: var(--active-bg); }
        .room-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; background: rgba(255,107,91,0.15); color: #FF6B5B; }
        .room-info { flex: 1; min-width: 0; }
        .room-name { font-size: 0.85rem; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .room-desc { font-size: 0.7rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .room-badge {
            font-size: 0.65rem; font-weight: 600;
            background: rgba(34,197,94,0.15); color: #22c55e;
            padding: 0.15rem 0.5rem; border-radius: 20px;
        }
        .unread-badge {
            background: var(--unread-bg);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            line-height: 18px;
            text-align: center;
            border-radius: 9px;
            padding: 0 4px;
            display: none;
            margin-left: 4px;
        }
        .room-item.has-unread .unread-badge { display: inline-block; }

        /* Main content */
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: stretch; justify-content: center; padding: 2rem; transition: background 0.3s; overflow: hidden; min-height: 0; }
        .empty-state { text-align: center; }
        .empty-state i { font-size: 3rem; color: var(--text-secondary); opacity: 0.3; margin-bottom: 1.5rem; }
        .empty-state h2 { font-weight: 700; color: var(--text-primary); margin-bottom: 0.5rem; }
        .empty-state p { color: var(--text-secondary); max-width: 300px; margin: 0 auto; }

        .chat-area {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            margin: 0;
            overflow: hidden;
        }
        .chat-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color); margin-bottom: 1rem; flex-shrink: 0; }
        .chat-header h4 { margin: 0; font-weight: 700; color: var(--text-primary); }
        .online-users { font-size: 0.8rem; color: var(--text-secondary); }

        .message-area {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 0.5rem;
            background: var(--input-bg);
            border-radius: 16px;
            margin-bottom: 0.5rem;
            display: flex;
            flex-direction: column;
            max-height: calc(100dvh - 260px);
        }

        .message-input-group {
            flex-shrink: 0;
            display: flex;
            gap: 0.5rem;
            padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom, 0px));
            background: none;
            position: sticky;
            bottom: 0;
            z-index: 10;
            width: 100%;
            box-sizing: border-box;
            border-top: 1px solid var(--border-color);
        }
        .message-input-group input { flex: 1; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-primary); border-radius: 12px; padding: 0.6rem 1rem; outline: none; }
        .message-input-group input::placeholder { color: var(--text-secondary); opacity: 0.5; }
        .message-input-group button { background: var(--brand-gradient); border: none; color: #fff; border-radius: 12px; padding: 0.6rem 1.2rem; font-weight: 600; cursor: pointer; flex-shrink: 0; }

        /* Message wrapper */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            width: fit-content;
            margin-bottom: 0.5rem;
        }
        .message-wrapper.own { align-self: flex-end; margin-left: auto; align-items: flex-end; }
        .message-wrapper.other { align-self: flex-start; margin-right: auto; align-items: flex-end; }
        .message-bubble {
            position: relative;
            padding: 0.5rem 1rem;
            border-radius: 16px;
            margin: 0 !important;
            max-width: 100%;
            width: 100%;
            word-wrap: break-word;
            transition: background 0.2s;
        }
        .message-bubble.own-message { background: var(--brand-gradient); color: #fff; }
        .message-bubble.other-message { background: var(--message-bg); color: var(--text-primary); }
        .message-bubble .sender { font-weight: 600; font-size: 0.8rem; color: inherit; }
        .message-bubble .text { margin-top: 0.2rem; }
        .message-bubble .reply-context { font-size: 0.7rem; background: rgba(0,0,0,0.1); padding: 0.2rem 0.5rem; border-radius: 8px; margin-bottom: 0.3rem; display: inline-block; }

        .message-bubble .timestamp {
            display: block;
            text-align: left;
            font-size: 0.65rem;
            opacity: 0.8;
            margin-top: 4px;
            line-height: 1;
            width: 100%;
        }

        .message-actions-row {
            display: none;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 2px;
            background: transparent !important;
            width: 100%;
        }
        .message-wrapper:hover .message-actions-row,
        .message-wrapper.show-actions .message-actions-row { display: flex; }
        .message-actions-row button {
            background: transparent !important;
            border: none !important;
            color: var(--text-secondary);
            padding: 2px 4px;
            font-size: 0.8rem;
            line-height: 1;
            cursor: pointer;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .message-actions-row button:hover { background: var(--hover-bg) !important; color: #FF6B5B; }

        .reply-preview {
            background: var(--active-bg); padding: 0.4rem 1rem; border-radius: 12px;
            margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center;
            font-size: 0.8rem; flex-shrink: 0;
        }
        .reply-preview .reply-text { flex: 1; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .reply-preview .cancel-reply { cursor: pointer; color: #FF6B5B; margin-left: 0.5rem; }
        .edit-input { width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-primary); border-radius: 8px; padding: 0.3rem 0.6rem; font-size: 0.9rem; }
        .edit-actions { display: flex; gap: 0.3rem; margin-top: 0.3rem; }
        .edit-actions button { background: var(--brand-gradient); border: none; color: white; border-radius: 6px; padding: 0.2rem 0.6rem; font-size: 0.75rem; cursor: pointer; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-secondary); border-radius: 10px; }

        /* Beautified modal styles */
        .modal-content.bg-dark {
            background: rgba(26, 23, 68, 0.95) !important;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        .modal-header { border-bottom: 1px solid rgba(255,255,255,0.08); }
        .modal-footer { border-top: 1px solid rgba(255,255,255,0.08); }
        .icon-circle {
            width: 56px; height: 56px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem auto;
        }
        .icon-circle.warning { background: rgba(255,193,7,0.15); color: #ffc107; }
        .btn-verbox { background: linear-gradient(135deg, #FF6B5B, #e85d4e); border: none; color: #fff; font-weight: 600; }
        .btn-verbox:hover { background: linear-gradient(135deg, #FF7B6B, #FF6B5B); color: #fff; }

        @media (min-width: 992px) { .app-container { flex-direction: row; } .sidebar { display: flex; } .mobile-header { display: none; } }
        @media (max-width: 576px) {
            .main-content { padding: 0.5rem 0.75rem; } .chat-area { max-width: 100%; }
            .chat-header { flex-wrap: wrap; gap: 0.3rem; }
            .chat-header h4 { font-size: 1rem; max-width: 100%; white-space: normal; overflow: hidden; text-overflow: ellipsis; }
            .online-users { max-width: 100%; font-size: 0.75rem; white-space: normal; overflow: hidden; text-overflow: ellipsis; }
            .message-wrapper { max-width: 88%; }
            .message-input-group { gap: 0.3rem; padding: 0.4rem 0.6rem calc(0.4rem + env(safe-area-inset-bottom, 0px)); }
            .message-input-group input { padding: 0.4rem 0.6rem; font-size: 0.92rem; }
            .message-input-group button { padding: 0.4rem 0.8rem; font-size: 0.92rem; flex-shrink: 0; }
            .message-input-group button .bi-send-fill { margin-right: 0; }
            .message-input-group button span { display: none; }
            .message-area { max-height: calc(100vh - 250px); }
            .room-item { padding: 0.5rem 0.6rem; } .room-name { font-size: 0.82rem; } .room-desc { font-size: 0.68rem; }
            .mobile-header { padding: 0.6rem 0.75rem; }
            .sidebar-actions button, .sidebar-actions a, .mobile-header button, .mobile-header a { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
<div class="bg-animated"></div><div class="bg-grid"></div>

<!-- Offcanvas Sidebar for mobile -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title text-white" id="mobileSidebarLabel">Rooms</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <a href="./profile.html" class="text-decoration-none">
            <div class="user-profile" id="offcanvasUserProfile">
                <div class="user-avatar" id="offcanvasAvatar">A</div>
                <div class="user-info">
                    <div class="user-name" id="offcanvasUserName">Loading...</div>
                    <div class="user-status"><i class="bi bi-circle-fill me-1" style="font-size: 0.4rem; color: #22c55e;"></i> Online</div>
                </div>
            </div>
        </a>
        <div class="rooms-header"><span>Rooms</span></div>
        <ul class="room-list" id="offcanvasRoomList"><!-- dynamically populated --></ul>
        <div class="mt-auto pt-3 border-top border-secondary">
            <button class="btn btn-outline-danger w-100" id="offcanvasLogout"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
        </div>
    </div>
</div>

<div class="app-container">
    <!-- Mobile Header -->
    <div class="mobile-header">
        <div class="d-flex align-items-center">
            <button class="hamburger-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar">
                <i class="bi bi-list"></i>
            </button>
            <div class="brand-logo-icon ms-2"><img src="./verbox-logo.svg" alt="Verbox"></div>
            <span class="brand-name ms-2">Verbox</span>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <button id="themeToggleBtnMobile" title="Toggle light/dark mode"><i id="themeIconMobile" class="bi bi-sun-fill"></i></button>
            <a href="./profile.html" title="Profile" class="text-secondary"><i class="bi bi-person-circle fs-5"></i></a>
        </div>
    </div>

    <!-- Desktop Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo-icon"><img src="./verbox-logo.svg" alt="Verbox"></div>
            <span class="brand-name">Verbox</span>
            <div class="sidebar-actions">
                <button id="themeToggleBtn" title="Toggle light/dark mode"><i id="themeIcon" class="bi bi-sun-fill"></i></button>
                <a href="./profile.html" title="Profile"><i class="bi bi-person-circle"></i></a>
                <a href="#" id="sidebarLogout" title="Logout"><i class="bi bi-box-arrow-right"></i></a>
            </div>
        </div>
        <a href="./profile.html" class="text-decoration-none">
            <div class="user-profile" id="sidebarUserProfile">
                <div class="user-avatar" id="sidebarAvatar">A</div>
                <div class="user-info">
                    <div class="user-name" id="sidebarUserName">Loading...</div>
                    <div class="user-status"><i class="bi bi-circle-fill me-1" style="font-size: 0.4rem; color: #22c55e;"></i> Online</div>
                </div>
            </div>
        </a>
        <div class="rooms-header"><span>Rooms</span></div>
        <ul class="room-list" id="roomList"><!-- dynamically populated --></ul>
    </aside>

    <!-- Main Chat Area -->
    <main class="main-content" id="mainContent">
        <div class="empty-state" id="emptyState">
            <i class="bi bi-chat-dots"></i>
            <h2>Select a room to start chatting</h2>
            <p>Choose one of the five rooms from the sidebar to jump into a conversation.</p>
        </div>
        <div class="chat-area" id="chatArea" style="display: none;">
            <div class="chat-header">
                <h4><i class="bi bi-hash text-verbox"></i> <span id="activeRoomName"></span></h4>
                <div class="online-users" id="onlineUsers"></div>
            </div>
            <div class="message-area" id="messageArea"></div>
            <div id="replyPreview" class="reply-preview" style="display: none;">
                <div class="reply-text" id="replyText"></div>
                <span class="cancel-reply" id="cancelReply"><i class="bi bi-x-lg"></i></span>
            </div>
            <div class="message-input-group">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button id="sendMessageBtn"><i class="bi bi-send-fill"></i> <span>Send</span></button>
            </div>
        </div>
    </main>
</div>

<!-- Beautified Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content bg-dark text-white border-secondary">
      <div class="modal-body text-center py-4">
        <div class="icon-circle warning mb-3">
          <i class="bi bi-question-circle-fill fs-1"></i>
        </div>
        <h6 id="confirmModalTitle" class="fw-bold mb-2">Confirm</h6>
        <p id="confirmModalBody" class="text-white-50 small mb-3"></p>
      </div>
      <div class="modal-footer border-secondary justify-content-center">
        <button type="button" class="btn btn-sm btn-outline-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-verbox" id="confirmModalOk">OK</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Theme toggle
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        localStorage.setItem('verbox-theme', isLight ? 'light' : 'dark');
        const icons = document.querySelectorAll('#themeIcon, #themeIconMobile');
        icons.forEach(icon => { icon.className = isLight ? 'bi bi-moon-fill' : 'bi bi-sun-fill'; });
    }
    const savedTheme = localStorage.getItem('verbox-theme');
    if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('themeIcon').className = 'bi bi-moon-fill';
        document.getElementById('themeIconMobile').className = 'bi bi-moon-fill';
    }
    document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
    document.getElementById('themeToggleBtnMobile').addEventListener('click', toggleTheme);

    // Beautified confirmation modal (returns a promise)
    function showConfirm(title, message) {
        return new Promise((resolve) => {
            document.getElementById('confirmModalTitle').textContent = title;
            document.getElementById('confirmModalBody').textContent = message;
            const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
            modal.show();
            const okBtn = document.getElementById('confirmModalOk');
            const handleOk = () => {
                okBtn.removeEventListener('click', handleOk);
                modal.hide();
                resolve(true);
            };
            okBtn.addEventListener('click', handleOk);
            const modalEl = document.getElementById('confirmModal');
            const handleCancel = () => {
                modalEl.removeEventListener('hidden.bs.modal', handleCancel);
                okBtn.removeEventListener('click', handleOk);
                resolve(false);
            };
            modalEl.addEventListener('hidden.bs.modal', handleCancel, { once: true });
        });
    }
    window.showConfirm = showConfirm;
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue, push, remove, update, serverTimestamp, query as dbQuery, orderByChild, startAt } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
    import firebaseConfig from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getDatabase(app);

    // DOM elements
    const roomList = document.getElementById('roomList');
    const offcanvasRoomList = document.getElementById('offcanvasRoomList');
    const emptyState = document.getElementById('emptyState');
    const chatArea = document.getElementById('chatArea');
    const activeRoomName = document.getElementById('activeRoomName');
    const messageArea = document.getElementById('messageArea');
    const messageInput = document.getElementById('messageInput');
    const sendMessageBtn = document.getElementById('sendMessageBtn');
    const onlineUsersDiv = document.getElementById('onlineUsers');
    const replyPreview = document.getElementById('replyPreview');
    const replyText = document.getElementById('replyText');
    const cancelReply = document.getElementById('cancelReply');
    const sidebarUserName = document.getElementById('sidebarUserName');
    const sidebarAvatar = document.getElementById('sidebarAvatar');
    const offcanvasUserName = document.getElementById('offcanvasUserName');
    const offcanvasAvatar = document.getElementById('offcanvasAvatar');
    const sidebarLogout = document.getElementById('sidebarLogout');
    const offcanvasLogout = document.getElementById('offcanvasLogout');

    let currentUser = null;
    let currentRoom = null;
    let messagesListener = null;
    let presenceListener = null;
    let presenceRef = null;
    let replyTo = null;
    const unreadListeners = {};

    const roomNames = ["GENERAL", "SPORTS", "POLITICS", "MOVIES & ANIME", "MUSIC"];

    onAuthStateChanged(auth, (user) => {
        if (!user) { window.location.href = "./login.html"; return; }
        currentUser = user;
        updateSidebarProfile(user);
        buildRoomList();
        roomNames.forEach(room => {
            const desktopBadge = document.getElementById(`badge-${room}`);
            const offcanvasBadge = document.getElementById(`offcanvas-badge-${room}`);
            if (desktopBadge) desktopBadge.textContent = '0 online';
            if (offcanvasBadge) offcanvasBadge.textContent = '0 online';
        });
    });

    function updateSidebarProfile(user) {
        const name = user.displayName || "User";
        sidebarUserName.textContent = name;
        sidebarAvatar.textContent = name.charAt(0).toUpperCase();
        offcanvasUserName.textContent = name;
        offcanvasAvatar.textContent = name.charAt(0).toUpperCase();
    }

    function buildRoomList() {
        const lists = [roomList, offcanvasRoomList];
        lists.forEach(list => {
            list.innerHTML = '';
            roomNames.forEach(roomName => {
                const li = document.createElement('li');
                li.className = 'room-item';
                li.setAttribute('data-room', roomName);
                li.innerHTML = `
                    <div class="room-icon">${getRoomEmoji(roomName)}</div>
                    <div class="room-info">
                        <div class="room-name">${roomName}</div>
                        <div class="room-desc">${getRoomDesc(roomName)}</div>
                    </div>
                    <span class="room-badge" id="${list.id === 'roomList' ? '' : 'offcanvas-'}badge-${roomName}">0 online</span>
                    <span class="unread-badge" id="${list.id === 'roomList' ? '' : 'offcanvas-'}unread-${roomName}">0</span>
                `;
                li.addEventListener('click', () => {
                    joinRoom(roomName);
                    const offcanvasEl = document.getElementById('mobileSidebar');
                    const offcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
                    if (offcanvas) offcanvas.hide();
                });
                list.appendChild(li);
            });
        });
        roomNames.forEach(room => setupUnreadListener(room));
    }

    function getRoomEmoji(room) {
        const emojis = { "GENERAL": "💬", "SPORTS": "⚽", "POLITICS": "🏛️", "MOVIES & ANIME": "🎬", "MUSIC": "🎵" };
        return emojis[room] || "💬";
    }
    function getRoomDesc(room) {
        const descs = { "GENERAL": "Anything goes", "SPORTS": "Game day talk", "POLITICS": "Current events", "MOVIES & ANIME": "Film & otaku", "MUSIC": "Tunes & playlists" };
        return descs[room] || "Group chat";
    }

    function setupUnreadListener(roomName) {
        if (!currentUser) return;
        const lastReadRef = ref(db, `users/${currentUser.uid}/rooms/${roomName}/lastRead`);
        onValue(lastReadRef, (snap) => {
            const lastRead = snap.val() || 0;
            const messagesRef = ref(db, `rooms/${roomName}/messages`);
            const unreadQuery = dbQuery(messagesRef, orderByChild('timestamp'), startAt(lastRead + 1));
            if (unreadListeners[roomName]) unreadListeners[roomName]();
            unreadListeners[roomName] = onValue(unreadQuery, (msgSnap) => {
                const count = msgSnap.size;
                const desktopBadge = document.getElementById(`unread-${roomName}`);
                const offcanvasBadge = document.getElementById(`offcanvas-unread-${roomName}`);
                const updateBadge = (el, cnt) => {
                    if (!el) return;
                    el.textContent = cnt;
                    el.style.display = cnt > 0 ? 'inline-block' : 'none';
                    const roomItem = el.closest('.room-item');
                    if (roomItem) {
                        if (cnt > 0) roomItem.classList.add('has-unread');
                        else roomItem.classList.remove('has-unread');
                    }
                };
                updateBadge(desktopBadge, count);
                updateBadge(offcanvasBadge, count);
            });
        });
    }

    // Logout (using modal)
    const logoutAction = (e) => {
        e.preventDefault();
        window.showConfirm('Sign Out', 'Are you sure you want to log out?')
            .then((confirmed) => {
                if (confirmed) {
                    return leaveCurrentRoom()
                        .then(() => signOut(auth))
                        .then(() => { window.location.href = "./login.html"; });
                }
            })
            .catch((error) => { console.error('Logout error:', error); });
    };
    sidebarLogout.addEventListener('click', logoutAction);
    offcanvasLogout.addEventListener('click', logoutAction);

    sendMessageBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    cancelReply.addEventListener('click', () => { replyTo = null; replyPreview.style.display = 'none'; });

    // ========== ROOM FUNCTIONS (then/catch) ==========
    function joinRoom(roomName) {
        if (currentRoom === roomName) return;
        leaveCurrentRoom()
            .then(() => set(ref(db, `users/${currentUser.uid}/rooms/${roomName}/lastRead`), Date.now()))
            .then(() => set(ref(db, `rooms/${roomName}/description`), 'Group chat'))
            .then(() => {
                presenceRef = ref(db, `rooms/${roomName}/presence/${currentUser.uid}`);
                return set(presenceRef, {
                    displayName: currentUser.displayName || currentUser.email,
                    joinedAt: serverTimestamp()
                });
            })
            .then(() => {
                const presencePath = ref(db, `rooms/${roomName}/presence`);
                presenceListener = onValue(presencePath, (snap) => {
                    const users = [];
                    if (snap.exists()) {
                        const presences = snap.val();
                        Object.values(presences).forEach(p => users.push(p.displayName));
                    }
                    onlineUsersDiv.textContent = `${users.length} online: ${users.join(', ')}`;
                    const desktopBadge = document.getElementById(`badge-${roomName}`);
                    const offcanvasBadge = document.getElementById(`offcanvas-badge-${roomName}`);
                    if (desktopBadge) desktopBadge.textContent = `${users.length} online`;
                    if (offcanvasBadge) offcanvasBadge.textContent = `${users.length} online`;
                });

                const messagesRef = ref(db, `rooms/${roomName}/messages`);
                messagesListener = onValue(messagesRef, (snap) => {
                    messageArea.innerHTML = '';
                    if (snap.exists()) {
                        const messagesObj = snap.val();
                        const messagesArray = Object.entries(messagesObj).map(([key, data]) => ({ id: key, ...data }));
                        messagesArray.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                        messagesArray.forEach(msg => renderMessage(msg));
                    }
                    messageArea.scrollTop = messageArea.scrollHeight;
                });

                currentRoom = roomName;
                activeRoomName.textContent = roomName;
                emptyState.style.display = 'none';
                chatArea.style.display = 'flex';
                highlightRoomInList(roomName);
            })
            .catch((error) => { console.error('joinRoom error:', error); });
    }

    function leaveCurrentRoom() {
        const promises = [];
        if (presenceRef) { promises.push(remove(presenceRef).then(() => { presenceRef = null; })); }
        if (presenceListener) { presenceListener(); presenceListener = null; }
        if (messagesListener) { messagesListener(); messagesListener = null; }
        if (currentRoom && currentUser) {
            promises.push(set(ref(db, `users/${currentUser.uid}/rooms/${currentRoom}/lastRead`), Date.now()));
        }
        if (currentRoom) {
            const desktopBadge = document.getElementById(`badge-${currentRoom}`);
            const offcanvasBadge = document.getElementById(`offcanvas-badge-${currentRoom}`);
            if (desktopBadge) desktopBadge.textContent = '0 online';
            if (offcanvasBadge) offcanvasBadge.textContent = '0 online';
        }
        currentRoom = null;
        chatArea.style.display = 'none';
        emptyState.style.display = 'block';
        activeRoomName.textContent = '';
        onlineUsersDiv.textContent = '';
        messageArea.innerHTML = '';
        replyTo = null;
        replyPreview.style.display = 'none';
        return Promise.all(promises);
    }

    // ===== RENDER MESSAGE =====
    function renderMessage(msg) {
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper';
        if (msg.senderId === currentUser?.uid) {
            wrapper.classList.add('own');
        } else {
            wrapper.classList.add('other');
        }
        wrapper.setAttribute('data-message-id', msg.id);

        const div = document.createElement('div');
        div.className = 'message-bubble';
        if (msg.senderId === currentUser?.uid) {
            div.classList.add('own-message');
        } else {
            div.classList.add('other-message');
        }

        let replyHTML = '';
        if (msg.replyTo) {
            replyHTML = `<div class="reply-context"><i class="bi bi-reply-fill"></i> @${msg.replyTo.sender}: ${msg.replyTo.text}</div>`;
        }

        const date = new Date(msg.timestamp || 0);
        const timeStr = date.toLocaleString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric', hour12: true });

        div.innerHTML = `
            ${replyHTML}
            <div class="sender">${msg.username || msg.sender}</div>
            <div class="text">${msg.text}</div> 
            <div class="timestamp">${timeStr}</div>
        `;

        const actionsRow = document.createElement('div');
        actionsRow.className = 'message-actions-row';
        let buttonsHTML = `<button class="reply-btn" title="Reply"><i class="bi bi-reply-fill"></i></button>`;
        if (msg.senderId === currentUser?.uid) {
            buttonsHTML += `
                <button class="edit-btn" title="Edit"><i class="bi bi-pencil-fill"></i></button>
                <button class="delete-btn" title="Delete"><i class="bi bi-trash-fill"></i></button>
            `;
        }
        actionsRow.innerHTML = buttonsHTML;

        wrapper.appendChild(div);
        wrapper.appendChild(actionsRow);
        messageArea.appendChild(wrapper);

        // Toggle actions on tap (mobile)
        wrapper.addEventListener('click', (e) => {
            if (!e.target.closest('.message-actions-row button')) {
                wrapper.classList.toggle('show-actions');
            }
        });

        // Reply event
        const replyBtn = actionsRow.querySelector('.reply-btn');
        if (replyBtn) {
            replyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                replyTo = { id: msg.id, sender: msg.sender, text: msg.text };
                replyText.textContent = `Replying to @${msg.sender}: ${msg.text}`;
                replyPreview.style.display = 'flex';
            });
        }

        // Edit & Delete events (using modal for delete)
        if (msg.senderId === currentUser?.uid) {
            const editBtn = actionsRow.querySelector('.edit-btn');
            const deleteBtn = actionsRow.querySelector('.delete-btn');
            editBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                startEditMessage(div, msg);
            });
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                window.showConfirm('Delete Message', 'Delete this message?')
                    .then((confirmed) => {
                        if (confirmed) {
                            remove(ref(db, `rooms/${currentRoom}/messages/${msg.id}`));
                        }
                    });
            });
        }
    }

    function startEditMessage(bubble, msg) {
        const textDiv = bubble.querySelector('.text');
        const originalText = textDiv.textContent;
        textDiv.innerHTML = `<input type="text" class="edit-input" value="${originalText}" />`;
        const editActions = document.createElement('div');
        editActions.className = 'edit-actions';
        editActions.innerHTML = `<button class="save-edit-btn">Save</button><button class="cancel-edit-btn">Cancel</button>`;
        textDiv.appendChild(editActions);
        const input = textDiv.querySelector('.edit-input');
        input.focus();
        const saveBtn = editActions.querySelector('.save-edit-btn');
        const cancelBtn = editActions.querySelector('.cancel-edit-btn');
        saveBtn.addEventListener('click', () => {
            const newText = input.value.trim();
            if (newText && newText !== originalText) {
                update(ref(db, `rooms/${currentRoom}/messages/${msg.id}`), { text: newText, edited: true })
                    .catch((error) => { console.error('Edit error:', error); });
            }
        });
        cancelBtn.addEventListener('click', () => { textDiv.innerHTML = originalText; });
    }

    function highlightRoomInList(roomName) {
        document.querySelectorAll('.room-item').forEach(item => {
            item.classList.remove('active');
            if (item.getAttribute('data-room') === roomName) item.classList.add('active');
        });
    }

    // ========== SEND MESSAGE ==========
    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !currentRoom || !currentUser) return;

        // Grab the username from localStorage (set during sign-up)
        let storedUsername = null;
        try {
            const storedUser = JSON.parse(localStorage.getItem('user'));
            if (storedUser && storedUser.username) {
                storedUsername = storedUser.username;
            }
        } catch (e) {}

        const messageData = {
            sender: currentUser.displayName || currentUser.email,   // fallback
            senderId: currentUser.uid,
            text: text,
            timestamp: Date.now()
        };

        // Only add username if it exists (custom sign-up)
        if (storedUsername) {
            messageData.username = storedUsername;
        }

        if (replyTo) {
            messageData.replyTo = { sender: replyTo.sender, text: replyTo.text };
            replyTo = null;
            replyPreview.style.display = 'none';
        }

        const messagesRef = ref(db, `rooms/${currentRoom}/messages`);
        push(messagesRef, messageData)
            .then(() => { messageInput.value = ''; })
            .catch((e) => { console.error('Send error:', e); });
    }

    window.addEventListener('beforeunload', () => {
        if (presenceRef) remove(presenceRef);
    });
</script>
</body>
</html>
